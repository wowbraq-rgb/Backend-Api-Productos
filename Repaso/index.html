<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="contenedor">

        <h1>Mis tareas</h1>

        <form id="todo-form">

            <input
                type="text"
                id="todo-input"
                placeholder="Escribe una tarea"
            >

            <button type="submit">
                Agregar
            </button>

        </form>

        <ul id="todo-list"></ul>

    </div>

    <script src="app.js"></script>

</body>
</html>
